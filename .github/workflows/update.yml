name: Update front-line map

on:
  schedule:
    - cron: "10 5 * * *"     # 05:10 UTC
    - cron: "10 17 * * *"    # 17:10 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Fetch only these (space separated: kalibrated russian_map isw telegram lostarmour gazetteer)"
        required: false

permissions:
  contents: write

concurrency:
  group: update-map
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch sources
        id: fetch
        continue-on-error: true
        run: python -m sources.fetch ${{ github.event.inputs.only }}

      - name: Build page
        run: |
          python build.py
          mkdir -p docs
          cp out/index.html docs/index.html

      - name: Commit
        run: |
          git config user.name "map-bot"
          git config user.email "map-bot@users.noreply.github.com"
          git add live gazetteer cache docs out/data.json
          git diff --cached --quiet && echo "nothing changed" || git commit -m "map update $(date -u +'%Y-%m-%d %H:%M')"
          git push

      - name: Note failed sources
        if: steps.fetch.outcome != 'success'
        run: echo "::warning::at least one source failed, see the Fetch step log. The page was rebuilt from what was available."
